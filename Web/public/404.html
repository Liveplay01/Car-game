<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Road closed · Roundabout Timing</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!--
      nginx answers every address that is not part of the game with this page (error_page 404).
      Self-contained on purpose: no bundle, no script (the CSP allows none inline), no font file.
      Same tokens as src/ui/shell.css; the roundabout is the game's own ring, closed by a barrier
      on the road, with the cars queueing in front of it, flashing and honking.
    -->
    <style>
      :root {
        --bg: #0b0d10;
        --road: #171b21;
        --island: #10141a;
        --primary: #f4f6f9;
        --muted: #99a2af;
        --faint: #8a929e;
        --accent: #ffb703;
        --accent-ink: #0e1013;
        --barrier: #ff5a5f;
        --lamp: #ffb23e;
        --light: #fff3c4;
        --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        --font-round: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--primary);
        font: 16px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(48px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .scene { width: 200px; height: 200px; }
      /*
        The queue at the closure: the front car creeps up to the barrier, flashes its headlights
        twice and honks; the one behind joins in a beat later. Brake lights stay on, the lamp blinks.
      */
      .pushy { animation: nudge 2.8s var(--ease-out) infinite; }
      .beams { fill: var(--light); opacity: 0; animation: flash 2.8s linear infinite; }
      .wave { opacity: 0; animation: honk 2.8s linear infinite; }
      .w2 { animation-delay: 0.08s; }
      .late, .late .beams { animation-delay: 1.4s; }
      .brake { fill: var(--barrier); }
      .lamp { animation: lamp 1.2s steps(1, end) infinite; }
      .copy { max-width: 34ch; }
      .code {
        margin: 0 0 8px;
        color: var(--faint);
        font: 600 13px/1.3 var(--font);
        font-variant-numeric: tabular-nums;
      }
      h1 {
        margin: 0 0 12px;
        font: 700 30px/1.15 var(--font-round);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      p { margin: 0; color: var(--muted); text-wrap: pretty; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        min-width: 240px;
        padding: 0 24px;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 600 17px/1 var(--font);
        text-decoration: none;
        transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out);
      }
      .button:active { transform: scale(0.97); opacity: 0.9; }
      .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      /* Forward is to the left: the ring turns counter-clockwise (right-hand traffic). */
      @keyframes nudge { 0%, 30%, 100% { transform: none; } 8% { transform: translateX(-2px); } 18% { transform: translateX(-1.2px); } }
      @keyframes flash { 0%, 6%, 13%, 100% { opacity: 0; } 2%, 4% { opacity: 0.9; } 9%, 11% { opacity: 0.9; } }
      @keyframes honk { 0%, 16%, 40%, 100% { opacity: 0; } 20%, 34% { opacity: 0.85; } }
      @keyframes lamp { 0% { opacity: 1; } 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) {
        .pushy, .lamp, .wave { animation: none; }
        .beams { animation: none; opacity: 0.6; }
        .wave { opacity: 0.7; }
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="scene" viewBox="16 12 168 168" role="img" aria-label="A roundabout at night, closed by a barrier on the road; the cars queue up in front of it and honk">
        <defs>
          <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="3" height="6" fill="var(--barrier)" />
            <rect x="3" width="3" height="6" fill="var(--primary)" />
          </pattern>
          <!-- One car from above, nose to the left (the way the ring turns at its top). -->
          <g id="car">
            <rect x="89" y="32.5" width="22" height="12" rx="3.5" />
            <rect x="93" y="34.5" width="5" height="8" rx="1.5" fill="var(--accent-ink)" fill-opacity="0.55" />
            <rect x="109.5" y="33.5" width="1.6" height="3" rx="0.8" class="brake" />
            <rect x="109.5" y="40.5" width="1.6" height="3" rx="0.8" class="brake" />
          </g>
          <!-- Its headlights flashed: two beams from the nose. -->
          <g id="beams">
            <path d="M89 35 L80 32.5 L80 37.5 Z" />
            <path d="M89 42 L80 39.5 L80 44.5 Z" />
          </g>
        </defs>
        <!-- Only the ring: no way in or out. -->
        <circle cx="100" cy="100" r="62" fill="none" stroke="var(--road)" stroke-width="34" />
        <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 8" />
        <circle cx="100" cy="100" r="44" fill="var(--island)" stroke="var(--accent)" stroke-opacity="0.28" stroke-width="2" />
        <!-- The closure, right across the road, with its warning lamp. -->
        <g transform="rotate(-14 100 100)">
          <rect x="97" y="22.5" width="6" height="32" rx="1.5" fill="url(#stripes)" />
          <rect x="95.5" y="21" width="9" height="3" rx="1" fill="#2a3038" />
          <rect x="95.5" y="53.5" width="9" height="3" rx="1" fill="#2a3038" />
          <circle class="lamp" cx="100" cy="19" r="2.6" fill="var(--lamp)" />
        </g>
        <!-- The queue: the last one waits, the middle one has had enough, the front one is the worst. -->
        <g transform="rotate(48 100 100)"><use href="#car" fill="#c9bca8" /></g>
        <g transform="rotate(25 100 100)">
          <g class="pushy late">
            <use href="#beams" class="beams" />
            <use href="#car" fill="#bfc6cf" />
          </g>
        </g>
        <g transform="rotate(2 100 100)">
          <g class="pushy">
            <use href="#beams" class="beams" />
            <!-- Its horn: sound arcs over the roof, out past the edge of the road. -->
            <g fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round">
              <path class="wave" d="M93 27 Q100 21.5 107 27" />
              <path class="wave w2" d="M90 21.5 Q100 13.5 110 21.5" />
            </g>
            <use href="#car" fill="var(--accent)" />
          </g>
        </g>
      </svg>
      <div class="copy">
        <p class="code">Error 404</p>
        <h1>This road is closed.</h1>
        <p>The page you were looking for is not on the map. The roundabout is still turning.</p>
      </div>
      <a class="button" href="/">Back to the roundabout</a>
    </main>
  </body>
</html>
