<!doctype html>
<!-- TEMPORARY: a sheet with every map skin drawn once, to look at them all at a glance. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map skins – preview</title>
    <style>
      body { margin: 0; background: #0b0d10; color: #f4f6f9; font: 13px/1.4 system-ui, sans-serif; }
      p { margin: 8px 12px; }
      .sheet { display: grid; grid-template-columns: repeat(4, 440px); gap: 2px; padding: 0 2px; }
      figure { position: relative; margin: 0; }
      figcaption { position: absolute; inset: 0 0 auto 0; padding: 4px 8px; background: rgba(11, 13, 16, 0.72); }
    </style>
  </head>
  <body>
    <p>Every map skin, drawn the way a shift draws it (cars on the ring, no HUD).</p>
    <div class="sheet" id="sheet"></div>
    <script type="module">
      import { World } from '/src/core/world.ts';
      import { baseConfig } from '/src/core/config.ts';
      import { forLevel } from '/src/core/levels.ts';
      import { MapTheme, MAP_THEMES } from '/src/present/mapThemes.ts';
      import { RenderList } from '/src/present/render.ts';
      import { CanvasDrawer } from '/src/present/draw.ts';
      import { CityLayer } from '/src/present/city.ts';
      import { SceneBuilder } from '/src/present/scene.ts';
      import { Skins } from '/src/present/skins.ts';
      import { v } from '/src/core/vec2.ts';

      const sheet = document.getElementById('sheet');
      // ?only=sand,vineyard shows just those maps, ?w=900 draws them bigger.
      const params = new URLSearchParams(location.search);
      const only = params.get('only')?.split(',');
      const TW = Number(params.get('w') ?? 440);
      const TH = Math.round((TW * 300) / 440);
      sheet.style.gridTemplateColumns = `repeat(${Number(params.get('cols') ?? 4)}, ${TW}px)`;
            const world = new World(forLevel(baseConfig, 8, 99), 99, { startsOnFirstTap: false });
      for (let i = 0; i < 120 * 6; i++) world.step();
      const t = world.time;
      const scale = (TH / 2 - 10) / (world.layout.ringRadius + Number(params.get('reach') ?? 250));
      const viewport = v(TW, TH);
      const camera = { viewport, center: v(0, 0), focus: v(TW / 2, TH / 2), scale };

      const build = (theme, cam, time) => {
        const list = new RenderList(cam, MapTheme.ground(theme));
        list.groundGrain = true;
        CityLayer.add(list, world, theme, time, null, null, time);
        SceneBuilder.addRoad(list, world.layout, world.config);
        CityLayer.addMapSkin(list, Skins.color(theme), world);
        MapTheme.addIsland(list, theme, world);
        SceneBuilder.addVehicles(list, world, 1, [], time, time, null);
        MapTheme.addAir(list, theme, time, false);
        return list;
      };

      // ?bench=1: each map 60 frames on a phone screen (390 × 844 points at 2×), build and draw timed.
      if (params.has('bench')) {
        const size = v(390, 844);
        const cam = { viewport: size, center: v(0, 0), focus: v(size.x / 2, size.y / 2), scale: size.x / 2 / (world.layout.ringRadius + 140) };
        const canvas = document.createElement('canvas');
        const drawer = new CanvasDrawer(canvas);
        drawer.resize(size.x, size.y, 2);
        const rows = [];
        for (const theme of [null, ...MAP_THEMES]) {
          let buildMs = 0;
          let drawMs = 0;
          let items = 0;
          for (let k = 0; k < 70; k++) {
            const a = performance.now();
            const list = build(theme, cam, t + k / 60);
            const b = performance.now();
            drawer.draw(list);
            canvas.getContext('2d').getImageData(0, 0, 1, 1);
            const c = performance.now();
            if (k < 10) continue;
            buildMs += b - a;
            drawMs += c - b;
            items = list.items.length;
          }
          rows.push([theme ?? 'none', items, buildMs / 60, drawMs / 60]);
        }
        rows.sort((x, y) => y[2] + y[3] - (x[2] + x[3]));
        const pre = document.createElement('pre');
        pre.textContent = 'map          items  build ms  draw ms  total ms\n' + rows.map(([n, i, bm, dm]) => `${n.padEnd(12)} ${String(i).padStart(5)}  ${bm.toFixed(2).padStart(8)}  ${dm.toFixed(2).padStart(7)}  ${(bm + dm).toFixed(2).padStart(8)}`).join('\n');
        pre.style.cssText = 'font: 13px/1.4 ui-monospace, monospace; margin: 12px';
        document.body.append(pre);
      }

      for (const theme of [null, ...MAP_THEMES].filter((x) => !params.has('bench') && (!only || only.includes(x ?? 'none')))) {
        const figure = document.createElement('figure');
        const canvas = document.createElement('canvas');
        canvas.width = TW;
        canvas.height = TH;
        const caption = document.createElement('figcaption');
        caption.textContent = theme ?? 'no map skin';
        figure.append(canvas, caption);
        sheet.append(figure);

        const list = build(theme, camera, t);
        const drawer = new CanvasDrawer(canvas);
        drawer.resize(TW, TH, 1);
        // ?frames=2 draws twice, the second time over the baked ground (it must look the same).
        for (let k = 0; k < Number(params.get('frames') ?? 1); k++) drawer.draw(list);
        caption.textContent += ` · ${list.items.length} items`;
      }
    </script>
  </body>
</html>
