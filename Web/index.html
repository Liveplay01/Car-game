<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Roundabout Timing – One-Tap Traffic Game</title>
    <meta name="description" content="Tap to send your cars into the gaps of a spinning roundabout. Chase down getaway trucks, dodge tankers and survive rush hour. Free in your browser." />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roundabout" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app" class="app" data-screen="ready" data-tabbar="shown">
      <canvas id="scene" class="scene" aria-label="Roundabout. Tap anywhere to send the front car." role="img"></canvas>
      <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
      <div id="layers"></div>
    </div>
    <noscript>This game needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
