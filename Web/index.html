    <!--
      The boot screen: the player's car circles the ring while the game loads, and main.ts takes it
      away once the game is on screen. If that never happens (a broken download, an old browser, a
      crash on start), it turns into a message in the game's own look after 20 s, without any
      script (the CSP allows none inline); main.ts shows it at once when the start throws. Afterwards
      it stays hidden: the shell brings it back with a reload if the game stops mid-play.
      The same ring as public/404.html: only the ring, no arms.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(48px + env(safe-area-inset-bottom, 0px));
        overflow-y: auto;
        background: #0b0d10;
        color: #f4f6f9;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
        transition: opacity 240ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .boot.gone { opacity: 0; pointer-events: none; }
      .boot[hidden] { display: none; }
      .boot svg { width: 152px; height: 152px; flex: none; margin-top: auto; }
      /* Counter-clockwise like the game's ring; it parks after eight laps, when the message comes. */
      .boot-car {
        transform-box: view-box;
        transform-origin: 100px 100px;
        animation: boot-orbit 2.5s linear 8, boot-stop 1.8s cubic-bezier(0.23, 1, 0.32, 1) 20s forwards;
      }
      /* The game's ring signal: ticks on the island's rim light up as the car passes the road beside them (the delays are set per tick in the markup). */
      .boot-sig { fill: none; stroke: #ffffff; stroke-width: 2.5; opacity: 0.16; animation: boot-sig 2.5s linear 8; animation-delay: var(--d); }
      /* On failure the car drives on to a blockade and stops in front of it. */
      .boot-block { opacity: 0; animation: boot-fade 300ms ease-out 19.7s forwards; }
      /* Folded away while loading, so the ring sits centred (auto margins, which never cut off the top
         on a short screen); it unfolds under the ring, which glides up. */
      .boot-fail {
        flex: none;
        max-width: 34ch;
        max-height: 0;
        margin-top: 0;
        margin-bottom: auto;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        animation: boot-show 400ms cubic-bezier(0.23, 1, 0.32, 1) 20s forwards;
      }
      .boot.failed .boot-car { animation: boot-stop 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
      .boot.failed .boot-sig { animation: none; }
      .boot.failed .boot-block { animation-delay: 0s; }
      .boot.failed .boot-fail { animation-delay: 0s; }
      .boot h1 { margin: 0 0 12px; font: 700 28px/1.15 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: -0.01em; text-wrap: balance; }
      .boot p { margin: 0 0 24px; color: #99a2af; text-wrap: pretty; }
      .boot a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        min-width: 200px;
        padding: 0 24px;
        border-radius: 14px;
        background: #ffb703;
        color: #0e1013;
        font-weight: 600;
        font-size: 17px;
        text-decoration: none;
      }
      .boot a:focus-visible { outline: 2px solid #ffb703; outline-offset: 3px; }
      @keyframes boot-orbit { to { transform: rotate(-360deg); } }
      @keyframes boot-stop { from { transform: rotate(var(--from, 0deg)); } to { transform: rotate(var(--to, -135deg)); } }
      @keyframes boot-sig { 0% { opacity: 1; } 30%, 100% { opacity: 0.16; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @keyframes boot-show { from { visibility: visible; } to { max-height: 32rem; margin-top: 32px; opacity: 1; visibility: visible; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-car, .boot-sig { animation: none; }
        .boot-fail { animation-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app" data-screen="ready" data-tabbar="shown">
      <canvas id="scene" class="scene" aria-label="Roundabout. Tap anywhere to send the front car." role="img"></canvas>
      <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
      <div id="layers"></div>
    </div>
    <div id="boot" class="boot" role="status">
      <svg viewBox="18 18 164 164" aria-hidden="true">
        <circle cx="100" cy="100" r="62" fill="none" stroke="#171b21" stroke-width="34" />
        <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 8" />
        <circle cx="100" cy="100" r="44" fill="#10141a" stroke="#ffb703" stroke-opacity="0.28" stroke-width="2" />
        <path class="boot-sig" d="M97.0 70.1 A30 30 0 0 1 103.0 70.1" style="--d: 0.000s" />
        <path class="boot-sig" d="M112.3 72.7 A30 30 0 0 1 117.5 75.6" style="--d: 2.292s" />
        <path class="boot-sig" d="M124.4 82.5 A30 30 0 0 1 127.3 87.7" style="--d: 2.083s" />
        <path class="boot-sig" d="M129.9 97.0 A30 30 0 0 1 129.9 103.0" style="--d: 1.875s" />
        <path class="boot-sig" d="M127.3 112.3 A30 30 0 0 1 124.4 117.5" style="--d: 1.667s" />
        <path class="boot-sig" d="M117.5 124.4 A30 30 0 0 1 112.3 127.3" style="--d: 1.458s" />
        <path class="boot-sig" d="M103.0 129.9 A30 30 0 0 1 97.0 129.9" style="--d: 1.250s" />
        <path class="boot-sig" d="M87.7 127.3 A30 30 0 0 1 82.5 124.4" style="--d: 1.042s" />
        <path class="boot-sig" d="M75.6 117.5 A30 30 0 0 1 72.7 112.3" style="--d: 0.833s" />
        <path class="boot-sig" d="M70.1 103.0 A30 30 0 0 1 70.1 97.0" style="--d: 0.625s" />
        <path class="boot-sig" d="M72.7 87.7 A30 30 0 0 1 75.6 82.5" style="--d: 0.417s" />
        <path class="boot-sig" d="M82.5 75.6 A30 30 0 0 1 87.7 72.7" style="--d: 0.208s" />
        <g class="boot-block" transform="rotate(205 100 100)">
          <rect x="97" y="21" width="6" height="34" rx="1.5" fill="#e5484d" />
          <rect x="97" y="26" width="6" height="5" fill="#ffffff" />
          <rect x="97" y="38" width="6" height="5" fill="#ffffff" />
        </g>
        <g class="boot-car">
          <rect x="89" y="32.5" width="22" height="12" rx="3.5" fill="#ffb703" />
          <rect x="93" y="34.5" width="5" height="8" rx="1.5" fill="#0e1013" fill-opacity="0.55" />
        </g>
      </svg>
      <div class="boot-fail">
        <h1>The roundabout did not start.</h1>
        <p>Something kept the game from loading. Check your connection and try again; your progress is safe on this device.</p>
        <a href="">Try again</a>
      </div>
    </div>
    <noscript><style>.boot-car, .boot-sig { animation: none; } .boot-fail { animation-delay: 0s; }</style></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
