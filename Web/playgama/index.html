<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roundabout Timing</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; }
  iframe { display: block; }
</style>
</head>
<body>
<iframe id="game" src="https://game.timing.love/?playgama" title="Roundabout Timing" allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe>
<script>
  // The game runs on our own address inside the frame, so this page holds the Bridge and
  // passes storage, the rewarded ad, pause and sound to it as messages (ui/playgama.ts).
  const GAME = 'https://game.timing.love';
  const frame = document.getElementById('game');
  const send = (message) => frame.contentWindow.postMessage({ pg: 1, ...message }, GAME);
  const ready = bridge.initialize().then(() => true, () => false);
  const ops = {
    get: (m) => bridge.storage.get(m.keys),
    set: (m) => bridge.storage.set(m.keys, m.values),
    delete: (m) => bridge.storage.delete(m.keys),
    ready: () => bridge.platform.sendMessage('game_ready'),
    rewarded: (m) => bridge.advertisement.showRewarded(m.placement),
  };

  ready.then((ok) => {
    if (!ok) return;
    const { EVENT_NAME } = bridge;
    bridge.advertisement.on(EVENT_NAME.REWARDED_STATE_CHANGED, (value) => send({ type: 'event', name: 'rewarded', value }));
    bridge.platform.on(EVENT_NAME.AUDIO_STATE_CHANGED, (value) => send({ type: 'event', name: 'audio', value }));
    bridge.platform.on(EVENT_NAME.PAUSE_STATE_CHANGED, (value) => send({ type: 'event', name: 'pause', value }));
  });

  window.addEventListener('message', async ({ source, origin, data }) => {
    if (source !== frame.contentWindow || origin !== GAME || data?.pg !== 1) return;
    const ok = await ready;
    if (data.op === 'hi') {
      send({ type: 'hello', ok, rewarded: ok && bridge.advertisement.isRewardedSupported, audio: ok && bridge.platform.isAudioEnabled });
      return;
    }
    try {
      if (!ok || !ops[data.op]) throw new Error('unavailable');
      send({ type: 'done', id: data.id, value: await ops[data.op](data) });
    } catch {
      send({ type: 'fail', id: data.id });
    }
  });
</script>
</body>
</html>
