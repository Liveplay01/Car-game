# Serves the built game (dist/) on port 5050. TLS and the domain are Coolify's proxy's job.

# Content-Security-Policy. Only our own files run. Inline styles stay allowed (the DOM helper
# sets style attributes), the photo is a blob or data image, and multiplayer talks to PeerJS's
# public broker (WebRTC itself, STUN and TURN, is not governed by the policy) and the
# leaderboard service (Server/, https://api-game.gustaff.dev). Big Screen (src/ui/backdrop.ts)
# shows a picture or video from any https link the player pastes, and YouTube through
# youtube-nocookie.com: hence `https:` for images and media, and that one frame. Any site may
# embed the game (frame-ancestors; the CrazyGames iOS app embeds from capacitor://).
# Clickio's consent message (index.html) loads on the normal page: its script and its API calls.
# The CrazyGames embed below gets none of it.
# The CrazyGames embed opens `/?crazygames` (src/storage/device.ts): only that page may also
# load their SDK and talk to their servers.
# The itch.io wrapper (itch/index.html) opens `/?itch` in an iframe: no consent message there.
# `npm run preview` sends the default policy, read from the `default` line (vite.config.ts),
# so a change can be tried locally.
map $args $csp {
    default "default-src 'self'; script-src 'self' 'sha256-TYq9Vj+8rxyhu+1KUCeRuQMR5yks/1GDhLg21YA89NQ=' 'sha256-YE9GD3f5umVvRPL1tzjHVGy1yt9r5j+LIzUs+FzPa7I=' 'sha256-VIl/Oa2LFXi7q4I+UgqN5dbqw1Q6CW2ff3fByRwUFLA=' https://clickiocmp.com https://*.clickiocmp.com https://s.clickiocdn.com https://analytics.kestrel.nrw https://cdn.applixir.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.googleadservices.com https://sdk.privacy-center.org https://gen.clickio.com https://s0.2mdn.net; style-src 'self' 'unsafe-inline' https://cdn.applixir.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://sdk.privacy-center.org https://gen.clickio.com https://clickiocmp.com https://*.clickiocmp.com https://*.clickiocdn.com https://analytics.kestrel.nrw https://*.applixir.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.googleadservices.com https://0.peerjs.com wss://0.peerjs.com https://api-game.gustaff.dev; frame-src https://www.youtube-nocookie.com https://*.applixir.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.googleadservices.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors * capacitor://app.crazygames.com";
    "~(^|&)itch(=|&|$)" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://api-game.gustaff.dev; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *";
    "~(^|&)crazygames(=|&|$)" "default-src 'self'; script-src 'self' https://*.crazygames.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://api-game.gustaff.dev https://*.crazygames.com wss://*.crazygames.com; frame-src https://*.crazygames.com https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors * capacitor://app.crazygames.com";
}

server {
    listen 5050;
    listen [::]:5050;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind Coolify's proxy: never redirect to an absolute URL with the internal port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Security headers. Caching below uses `expires` only, so these are inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No X-Frame-Options: any site may embed the game in an iframe (frame-ancestors in $csp above).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    # Cloud sync's "save the code in the password manager" (src/ui/cloudSheet.ts): a hidden form
    # "signs in" here inside a hidden frame, so the browser asks to keep it. Nothing is read or
    # stored: the answer is an empty page (hence `form-action 'self'` in the policy above).
    location = /keep-code {
        default_type text/html;
        expires -1;
        return 200 '<!doctype html><meta charset="utf-8"><title>Saved</title>';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The changelog as data (vite.config.ts writes it from src/present/patchNotes.ts): the website
    # (timing.love/changelog) and anyone else may read it from the browser. Five minutes of cache
    # keep the load off the game's server; a new deploy shows up within that. add_header in a
    # location replaces the inherited ones, so the two that matter here are repeated.
    location = /changelog.json {
        default_type application/json;
        expires 5m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The website's facts as data (vite.config.ts writes them from src/present/siteData.ts):
    # museum, collection, trials and titles with the game's own art. Open like the changelog.
    location ^~ /data/ {
        default_type application/json;
        expires 5m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed file names: safe to cache for a year. A missing file is a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Digital Asset Links for the Google Play app (public/.well-known/assetlinks.json): proves the
    # app belongs to this site, so Chrome opens it full screen without an address bar. Never
    # index.html in its place, or the check fails silently.
    location /.well-known/ {
        expires 1h;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    # Sounds and music: not hashed, so a month, and never index.html in their place.
    location /audio/ {
        types {
            audio/mp4 m4a;
        }
        expires 30d;
        try_files $uri =404;
    }

    # The service worker, the manifest and the page itself must always be revalidated,
    # or players keep an old version.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # Every miss (a mistyped address, an old link, a missing file) gets the game's own "road
    # closed" page (public/404.html) with the real 404 status, never the browser's or nginx's.
    error_page 404 /404.html;
    location = /404.html {
        expires -1;
        internal;
    }

    # A crew's invite link (`/k/CODE?by=FRIENDCODE`) lives on the game's own address, so the Play app and an installed web
    # app open it instead of the browser. It is the game: src/net/crews.ts reads the path and goes back to `/`.
    location ^~ /k/ {
        expires -1;
        try_files /index.html =404;
    }

    # The game is `/` (CrazyGames and the Play app add a query, challenges and invites a hash);
    # the legal pages also answer without `.html` (/privacy, /imprint). Nothing else is a page:
    # there is no routing in the game, so an unknown path is a 404 instead of a silent game.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }
}
