# Serves the built game (dist/) on port 5050. TLS and the domain are Coolify's proxy's job.
server {
    listen 5050;
    listen [::]:5050;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind Coolify's proxy: never redirect to an absolute URL with the internal port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Security headers. Caching below uses `expires` only, so these are inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year. A missing file is a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    # The service worker, the manifest and the page itself must always be revalidated,
    # or players keep an old version.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
