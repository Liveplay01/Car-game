# Serves the built game (dist/) on port 5050. TLS and the domain are Coolify's proxy's job.

# Content-Security-Policy. Only our own files run. Inline styles stay allowed (the DOM helper
# sets style attributes), the photo is a blob or data image, and multiplayer talks to PeerJS's
# public broker (WebRTC itself, STUN and TURN, is not governed by the policy) and the
# leaderboard service (Server/, https://api-game.gustaff.dev). Any site may
# embed the game (frame-ancestors; the CrazyGames iOS app embeds from capacitor://).
# The CrazyGames embed opens `/?crazygames` (src/storage/device.ts): only that page may also
# load their SDK and talk to their servers. `npm run preview` sends the default policy, read
# from the `default` line (vite.config.ts), so a change can be tried locally.
map $args $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://api-game.gustaff.dev; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors * capacitor://app.crazygames.com";
    "~(^|&)crazygames(=|&|$)" "default-src 'self'; script-src 'self' https://*.crazygames.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.crazygames.com; media-src 'self' blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://api-game.gustaff.dev https://*.crazygames.com wss://*.crazygames.com; frame-src https://*.crazygames.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors * capacitor://app.crazygames.com";
}

server {
    listen 5050;
    listen [::]:5050;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind Coolify's proxy: never redirect to an absolute URL with the internal port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Security headers. Caching below uses `expires` only, so these are inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No X-Frame-Options: any site may embed the game in an iframe (frame-ancestors in $csp above).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year. A missing file is a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    # Sounds and music: not hashed, so a month, and never index.html in their place.
    location /audio/ {
        types {
            audio/mp4 m4a;
        }
        expires 30d;
        try_files $uri =404;
    }

    # The service worker, the manifest and the page itself must always be revalidated,
    # or players keep an old version.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # The legal pages also answer without `.html` (/privacy, /imprint); everything else is the game.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
